<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Movie Recommender</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding-top: 5rem;
    }
    .container {
      max-width: 400px;
    }
  </style>
</head>
<body>
<div class="container">
  <h2 class="text-center mb-4">Welcome</h2>

  <ul class="nav nav-tabs mb-3" id="authTabs">
    <li class="nav-item">
      <a class="nav-link active" href="#" id="show-login">Login</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" id="show-signup">Sign Up</a>
    </li>
  </ul>

  <div class="card card-body">
    <input type="text" id="auth-username" class="form-control mb-2" placeholder="Username">
    <input type="password" id="auth-password" class="form-control mb-2" placeholder="Password">
    <button class="btn btn-primary w-100" id="auth-submit">Login</button>
    <div class="mt-3 text-center text-success d-none" id="auth-status"></div>
  </div>
</div>

<script>
  const authBtn = document.getElementById("auth-submit");
  let isSignup = false;

  document.getElementById("show-login").onclick = function () {
    isSignup = false;
    this.classList.add("active");
    document.getElementById("show-signup").classList.remove("active");
    authBtn.textContent = "Login";
  };

  document.getElementById("show-signup").onclick = function () {
    isSignup = true;
    this.classList.add("active");
    document.getElementById("show-login").classList.remove("active");
    authBtn.textContent = "Sign Up";
  };

  authBtn.onclick = function () {
    const username = document.getElementById("auth-username").value;
    const password = document.getElementById("auth-password").value;

    fetch(isSignup ? "/signup" : "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    })
    .then(res => res.json())
    .then(data => {
      if (data.message) {
        setTimeout(() => window.location.href = "/recommend", 300);
      } else {
        alert(data.error);
      }
    });
  };
</script>
</body>
</html>
