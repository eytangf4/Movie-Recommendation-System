<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Movie Recommender</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      color: #2d3a4b;
    }
    .glass-card {
      background: rgba(255,255,255,0.7);
      border-radius: 2rem;
      box-shadow: 0 8px 32px 0 rgba(31,38,135,0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 2.5rem 2rem 2rem 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .glass-title {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: #2d3a4b;
      letter-spacing: 1px;
    }
    .nav-tabs {
      border-bottom: none;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .nav-link {
      border: none;
      color: #64748b;
      font-weight: 600;
      font-size: 1.1rem;
      background: transparent;
      border-radius: 0.75rem 0.75rem 0 0;
      transition: color 0.2s, background 0.2s;
    }
    .nav-link.active {
      color: #2563eb;
      background: #e0e7ff;
    }
    .form-control {
      border-radius: 0.75rem;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      padding: 0.7rem 1rem;
      border: 1.5px solid #e5e7eb;
      background: rgba(255,255,255,0.85);
    }
    .btn-primary {
      background: #4f8cff;
      border: none;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 0.7rem 0;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #2563eb;
    }
    .card.card-body {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
    }
    #auth-status {
      font-size: 1rem;
      font-weight: 500;
    }
    @media (max-width: 600px) {
      .glass-card { padding: 1.5rem 0.5rem; }
      .glass-title { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
<div class="glass-card">
  <div class="glass-title">Welcome</div>
  <ul class="nav nav-tabs mb-3" id="authTabs">
    <li class="nav-item">
      <a class="nav-link active" href="#" id="show-login">Login</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="#" id="show-signup">Sign Up</a>
    </li>
  </ul>
  <div class="card card-body">
    <input type="text" id="auth-username" class="form-control mb-2" placeholder="Username">
    <input type="password" id="auth-password" class="form-control mb-2" placeholder="Password">
    <button class="btn btn-primary w-100" id="auth-submit">Login</button>
    <div class="mt-3 text-center text-success d-none" id="auth-status"></div>
  </div>
</div>
<script>
  const authBtn = document.getElementById("auth-submit");
  let isSignup = false;

  document.getElementById("show-login").onclick = function () {
    isSignup = false;
    this.classList.add("active");
    document.getElementById("show-signup").classList.remove("active");
    authBtn.textContent = "Login";
  };

  document.getElementById("show-signup").onclick = function () {
    isSignup = true;
    this.classList.add("active");
    document.getElementById("show-login").classList.remove("active");
    authBtn.textContent = "Sign Up";
  };

  authBtn.onclick = function () {
    const username = document.getElementById("auth-username").value;
    const password = document.getElementById("auth-password").value;

    fetch(isSignup ? "/signup" : "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    })
    .then(res => res.json())
    .then(data => {
      if (data.message) {
        document.getElementById("auth-status").textContent = data.message;
        document.getElementById("auth-status").classList.remove("d-none");
        setTimeout(() => window.location.href = data.redirect, 300);
      } else {
        alert(data.error);
      }
    });
  };
</script>
</body>
</html>
