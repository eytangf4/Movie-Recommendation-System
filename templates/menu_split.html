<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Recommender</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(90deg, #4f8cff 50%, #fff 50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .split-card {
      background: #fff;
      border-radius: 1.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: left;
      position: relative;
      z-index: 1;
    }
    .split-title {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 2.2rem;
      color: #4f8cff;
      letter-spacing: 1px;
    }
    .split-btn {
      width: 100%;
      margin-bottom: 1.1rem;
      font-size: 1.1rem;
      padding: 0.8rem 0;
      border-radius: 0.7rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.7em;
      box-shadow: 0 2px 8px rgba(79,140,255,0.07);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .split-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 4px 16px rgba(79,140,255,0.15);
    }
    .split-btn-primary { background: #4f8cff; color: #fff; border: none; }
    .split-btn-success { background: #22c55e; color: #fff; border: none; }
    .split-btn-outline { background: #fff; color: #64748b; border: 2px solid #cbd5e1; }
    .split-btn-outline:hover { color: #4f8cff; border-color: #4f8cff; }
    .split-icon { font-size: 1.2em; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
  <div class="split-card">
    <div class="split-title">Movie Recommender</div>
    <a href="/library" class="btn split-btn split-btn-primary"><i class="fa-solid fa-film split-icon"></i>Edit Library</a>
    <a href="/recommend_from_library" class="btn split-btn split-btn-success"><i class="fa-solid fa-magic-wand-sparkles split-icon"></i>Generate Recommendations</a>
    <a href="/one_off_recommend" class="btn split-btn split-btn-outline"><i class="fa-solid fa-bolt split-icon"></i>One-Off Recommendation</a>
  </div>
</body>
</html>
